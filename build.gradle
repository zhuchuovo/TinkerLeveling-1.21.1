plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'org.embeddedt'
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = 'TinkerLeveling'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
}

def tconstructJar = file(findProperty('tconstruct_jar') ?: "../TinkersConstruct-1.21.1/build/libs/TinkersConstruct-${minecraft_version}-${tconstruct_version}.jar")
def mantleJar = file(findProperty('mantle_jar') ?: "../Mantle-1.21.1/build/libs/Mantle-${minecraft_version}-${mantle_version}.jar")

if (!tconstructJar.isFile()) {
    throw new GradleException("Tinkers Construct development JAR not found: ${tconstructJar}. Build TinkersConstruct-1.21.1 first or set -Ptconstruct_jar=<path>.")
}
if (!mantleJar.isFile()) {
    throw new GradleException("Mantle development JAR not found: ${mantleJar}. Build Mantle-1.21.1 first or set -Pmantle_jar=<path>.")
}

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = file('run')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        tinkerleveling { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation files(mantleJar)
    implementation files(tconstructJar)
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        version: project.version,
        loader_range: loader_range,
        minecraft_range: minecraft_range,
        neo_range: neo_range,
        tconstruct_range: tconstruct_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Tinker Leveling',
            'Specification-Vendor': 'embeddedt',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'embeddedt'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

